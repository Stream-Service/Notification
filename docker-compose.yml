services:
  
  kafka:
    image: confluentinc/cp-kafka:7.8.3
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'

      # IMPORTANT: Use your AWS Public IP here so your laptop/apps can connect
      KAFKA_CREATE_TOPICS: "email:1:1"

      # 3. ALLOW AUTO-CREATION (Backup strategy)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'



      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://13.53.35.69:9092'

      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'

      # KRaft specific
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk' # Must be a valid Base64 string
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    volumes:
      - ./kafka_data:/var/lib/kafka/data
    restart: always




  redis:
   image: redis:latest
   container_name: redis
   ports:
     - "6379:6379"

       
